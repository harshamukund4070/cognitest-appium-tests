[pytest]
testpaths = appium_tests/tests selenium_tests/tests api_tests/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_tc*
addopts = 
    -v
    --tb=short
    --html=reports/pytest_report.html
    --self-contained-html
    --reruns=1
    --reruns-delay=2
log_cli = true
log_cli_level = INFO
