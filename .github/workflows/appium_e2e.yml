name: CogniTest Android - Appium E2E Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      test_module:
        description: 'Test module to run (leave empty for all 300 tests)'
        required: false
        default: ''

jobs:
  appium-e2e-tests:
    name: Appium E2E Tests (Android Emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        api-level: [30]
        target: [google_apis]
        arch: [x86_64]

    env:
      TEST_EMAIL: ${{ secrets.TEST_EMAIL || 'test@cognitest.com' }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD || 'Test@1234' }}
      BACKEND_URL: ${{ secrets.BACKEND_URL || 'http://localhost:3001' }}
      APPIUM_SERVER_URL: http://127.0.0.1:4723
      APK_PATH: app-debug.apk

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java (for Android emulator) ────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Python ─────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ── 4. Android SDK / Emulator ─────────────────────────────────────────
      - name: Enable KVM for hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}-${{ matrix.target }}-${{ matrix.arch }}

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "Emulator started - snapshot created"

      # ── 5. Download APK artifact ──────────────────────────────────────────
      - name: Download APK (from release or manual upload)
        run: |
          # Try to get APK from GitHub release assets first
          # If not available, use the one in the repo or skip device install
          if [ -f "app-debug.apk" ]; then
            echo "APK found in repo"
          else
            echo "APK not found - tests will run against pre-installed app or skip install"
            # Create a placeholder so config doesn't fail
            touch app-debug.apk.placeholder
          fi

      # ── 6. Node.js + Appium ───────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium and UiAutomator2 driver
        run: |
          npm install -g appium
          appium driver install uiautomator2
          appium driver list

      # ── 7. Start Appium server ────────────────────────────────────────────
      - name: Start Appium server
        run: |
          appium --log appium.log --log-timestamp &
          echo "Waiting for Appium to start..."
          sleep 10
          curl -s http://127.0.0.1:4723/status | python3 -c "import sys,json; d=json.load(sys.stdin); print('✅ Appium ready:', d['value']['message'])"

      # ── 8. Run tests inside emulator ──────────────────────────────────────
      - name: Run all 300 Appium E2E tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            # Wait for emulator to fully boot
            adb wait-for-device
            adb shell input keyevent 82
            
            # Install APK if present
            if [ -f "app-debug.apk" ] && [ -s "app-debug.apk" ]; then
              echo "Installing CogniTest APK..."
              adb install -r app-debug.apk
            fi
            
            # Create reports directories
            mkdir -p reports/screenshots
            
            # Set APK path in config
            export APK_PATH=$(pwd)/app-debug.apk
            
            # Run tests
            if [ -n "${{ github.event.inputs.test_module }}" ]; then
              pytest tests/${{ github.event.inputs.test_module }} \
                --html=reports/pytest_report.html \
                --self-contained-html \
                -v --tb=short \
                --reruns=1 --reruns-delay=3 \
                -o "log_cli=true" \
                2>&1 | tee reports/test_output.log || true
            else
              pytest tests/ \
                --html=reports/pytest_report.html \
                --self-contained-html \
                -v --tb=short \
                --reruns=1 --reruns-delay=3 \
                -o "log_cli=true" \
                2>&1 | tee reports/test_output.log || true
            fi

      # ── 9. Generate summary ────────────────────────────────────────────────
      - name: Generate test summary
        if: always()
        run: |
          python3 - <<'EOF'
          import os, glob

          log_file = "reports/test_output.log"
          if not os.path.exists(log_file):
              print("No test output found")
              exit(0)

          with open(log_file) as f:
              content = f.read()

          # Parse pytest summary line
          passed = failed = error = skipped = 0
          for line in content.splitlines():
              if "passed" in line and "==" in line:
                  parts = line.split()
                  for i, p in enumerate(parts):
                      if p == "passed,":
                          passed = int(parts[i-1])
                      elif p == "failed,":
                          failed = int(parts[i-1])
                      elif p == "error,":
                          error = int(parts[i-1])
                      elif p == "skipped":
                          skipped = int(parts[i-1])

          total = passed + failed + error + skipped
          rate  = (passed / total * 100) if total else 0

          summary = f"""
          ## 🧠 CogniTest Appium E2E Test Results

          | Metric         | Value       |
          |----------------|-------------|
          | Total Tests    | {total}     |
          | ✅ Passed       | {passed}    |
          | ❌ Failed       | {failed}    |
          | ⚠️ Errors       | {error}     |
          | ⏭️ Skipped      | {skipped}   |
          | Pass Rate      | {rate:.1f}% |

          ### Reports
          - 📊 Excel Analysis Report (download from artifacts)
          - 📋 HTML Pytest Report (download from artifacts)
          - 📸 Screenshots (download from artifacts)
          """

          with open(os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null"), "a") as f:
              f.write(summary)

          print(summary)
          EOF

      # ── 10. Upload reports as artifacts ───────────────────────────────────
      - name: Upload Excel report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: excel-analysis-report
          path: reports/cognitest_e2e_report.xlsx
          retention-days: 30

      - name: Upload HTML pytest report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: html-pytest-report
          path: reports/pytest_report.html
          retention-days: 30

      - name: Upload test screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-screenshots
          path: reports/screenshots/
          retention-days: 14

      - name: Upload Appium server log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appium-server-log
          path: appium.log
          retention-days: 7

      - name: Upload full test output log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output-log
          path: reports/test_output.log
          retention-days: 14

      # ── 11. Comment on PR ─────────────────────────────────────────────────
      - name: Comment test results on PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request' && always()
        with:
          script: |
            const fs = require('fs');
            let summary = '## 🧠 CogniTest Appium E2E Test Results\n\n';
            try {
              const log = fs.readFileSync('reports/test_output.log', 'utf8');
              const lines = log.split('\n');
              const summaryLine = lines.filter(l => l.includes('passed') && l.includes('==')).pop();
              summary += summaryLine ? `\`\`\`\n${summaryLine}\n\`\`\`` : 'See artifacts for details.';
            } catch(e) {
              summary += 'Test results available in workflow artifacts.';
            }
            summary += '\n\n📦 Download reports from the Actions artifacts tab.';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
