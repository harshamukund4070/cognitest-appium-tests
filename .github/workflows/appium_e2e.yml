name: CogniTest Android - Appium E2E Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      test_module:
        description: 'Test module to run'
        required: false
        default: ''

jobs:
  appium-e2e-tests:
    name: Appium E2E Tests (Android Emulator)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        api-level: [29]
        target: [default]
        arch: [x86_64]

    env:
      TEST_EMAIL: ${{ secrets.TEST_EMAIL || 'test@cognitest.com' }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD || 'Test@1234' }}
      BACKEND_URL: ${{ secrets.BACKEND_URL || 'http://localhost:3001' }}
      APPIUM_SERVER_URL: http://127.0.0.1:4723
      APK_PATH: app-debug.apk

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java (for Android emulator) ────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Python ─────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ── 4. Android SDK / Emulator ─────────────────────────────────────────
      - name: Enable KVM for hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}-${{ matrix.target }}-${{ matrix.arch }}

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: echo "Emulator started - snapshot created"

      # ── 5. Download APK artifact ──────────────────────────────────────────
      - name: Download APK (from release or manual upload)
        run: |
          if [ -f "app-debug.apk" ]; then
            echo "APK found in repo"
          else
            echo "APK not found - tests will run against pre-installed app or skip install"
            touch app-debug.apk.placeholder
          fi

      # ── 6. Node.js + Appium ───────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium and UiAutomator2 driver
        run: |
          npm install -g appium
          appium driver install uiautomator2
          appium driver list

      # ── 7. Start Appium server ────────────────────────────────────────────
      - name: Start Appium server
        run: |
          appium --log appium.log --log-timestamp &
          echo "Waiting for Appium to start..."
          sleep 10
          curl -s http://127.0.0.1:4723/status | python3 -c "import sys,json; d=json.load(sys.stdin); print('✅ Appium ready:', d['value']['message'])"

      # ── 7.5 Start Mock Backend Server ──────────────────────────────────────
      - name: Start Mock Backend Server
        run: |
          python3 utils/mock_backend.py &
          echo "Waiting for Mock Backend Server to initialize..."
          sleep 5

      # ── 8. Run tests inside emulator ──────────────────────────────────────
      - name: Run all 700 E2E tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: |
            chmod +x run_ci_tests.sh
            ./run_ci_tests.sh "${{ github.event.inputs.test_module }}"

      # ── 9. Generate summary ────────────────────────────────────────────────
      - name: Generate test summary
        if: always()
        run: |
          python3 utils/generate_summary.py

      # ── 10. Commit README update back to repository ───────────────────────
      - name: Commit and Push updated README
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update main dashboard with live verification stats [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Push failed"

      # ── 11. Upload reports as artifacts ───────────────────────────────────
      # ── 11. Upload reports as artifacts ───────────────────────────────────
      - name: Upload API HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-html-report
          path: reports/api_report.html
          retention-days: 30

      - name: Upload API Excel report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-excel-report
          path: reports/api_e2e_report.xlsx
          retention-days: 30

      - name: Upload Selenium HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-html-report
          path: reports/selenium_report.html
          retention-days: 30

      - name: Upload Selenium Excel report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-excel-report
          path: reports/selenium_e2e_report.xlsx
          retention-days: 30

      - name: Upload Appium HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appium-html-report
          path: reports/appium_report.html
          retention-days: 30

      - name: Upload Appium Excel report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appium-excel-report
          path: reports/appium_e2e_report.xlsx
          retention-days: 30

      - name: Upload test screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-screenshots
          path: reports/screenshots/
          retention-days: 14

      - name: Upload Appium server log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appium-server-log
          path: appium.log
          retention-days: 7

      - name: Upload full test output log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output-log
          path: reports/test_output.log
          retention-days: 14

      - name: Upload SAST security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-vulnerability-report
          path: reports/sast_vulnerabilities.txt
          retention-days: 30

      - name: Upload Load test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-testing-report
          path: reports/load_test_report.json
          retention-days: 30

      # ── 12. Comment on PR ─────────────────────────────────────────────────
      - name: Comment test results on PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request' && always()
        with:
          script: |
            const fs = require('fs');
            let summary = '## 🧠 CogniTest Appium E2E Test Results\n\n';
            try {
              const log = fs.readFileSync('reports/test_output.log', 'utf8');
              const lines = log.split('\n');
              const summaryLine = lines.filter(l => l.includes('passed') && l.includes('==')).pop();
              summary += summaryLine ? `\`\`\`\n${summaryLine}\n\`\`\`` : 'See artifacts for details.';
            } catch(e) {
              summary += 'Test results available in workflow artifacts.';
            }
            summary += '\n\n📦 Download reports from the Actions artifacts tab.';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
